name: Sync public Drive videos
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: write
concurrency:
  group: drive-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare thumbnails tool
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Refresh verified catalog
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: |
          node --test tools/sync-drive.test.mjs
          node tools/sync-drive.mjs
      - name: Publish metadata and thumbnails
        run: |
          git config user.name 'Number Village catalog'
          git config user.email 'catalog@users.noreply.github.com'
          git add videos
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync Drive video catalog'
            git push
          fi
